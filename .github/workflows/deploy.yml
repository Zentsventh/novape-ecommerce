name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar PHP 8.2
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        
    - name: Instalar dependencias de PHP (Composer)
      run: composer install --ignore-platform-reqs --optimize-autoloader --no-dev

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependencias de JS y Compilar (Vite)
      run: |
        npm install
        npm run build

    - name: Preparar carpetas para la doble subida (cPanel)
      run: |
        mkdir -p deploy_root
        mkdir -p deploy_public
        
        # Copiar todo (excluyendo basura y excluyendo vendor porque ya está en el servidor)
        rsync -a --exclude='.git' --exclude='.github' --exclude='deploy_root' --exclude='deploy_public' --exclude='node_modules' --exclude='tests' --exclude='vendor' ./ deploy_root/
        
        # Mover solo el contenido público a la carpeta pública temporal
        mv deploy_root/public/* deploy_public/
        rm -rf deploy_root/public

    - name: 🚀 Instalar lftp
      run: sudo apt-get update && sudo apt-get install -y lftp

    - name: 🚀 Subir el cerebro de Laravel (carpeta novape)
      run: |
        lftp -c "set ftp:ssl-allow yes; set ssl:verify-certificate no; open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }}; mirror -R -v --parallel=5 ./deploy_root/ ./novape/"

    - name: 🚀 Subir los archivos públicos (carpeta public_html)
      run: |
        lftp -c "set ftp:ssl-allow yes; set ssl:verify-certificate no; open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }}; mirror -R -v --parallel=5 ./deploy_public/ ./public_html/"
